# Fixtura — Nginx reverse proxy + SSL + rate limit
#
# Reemplazá fixtura.cl por el dominio real antes de levantar.
# Para emitir certs Let's Encrypt:
#   docker run -it --rm \
#     -v /etc/letsencrypt:/etc/letsencrypt \
#     -v $(pwd)/nginx/certbot/www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d fixtura.cl -d www.fixtura.cl

# Rate limit zones — declarar en http context (este archivo está incluido
# desde /etc/nginx/conf.d, ya está dentro de http {}).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name fixtura.cl www.fixtura.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name fixtura.cl www.fixtura.cl;

    ssl_certificate /etc/letsencrypt/live/fixtura.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixtura.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Headers de seguridad (redundantes con los del API/Next pero defensa
    # en profundidad — nunca confiar en una sola capa).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # API
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate limit estricto en login
    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=2 nodelay;
        proxy_pass http://api:3000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
