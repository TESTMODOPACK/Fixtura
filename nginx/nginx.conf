# LigaPlus — Nginx reverse proxy + SSL + rate limit
#
# Requiere DNS apuntando ligaplus.cl y www.ligaplus.cl al VPS y certs
# emitidos ANTES de activar este conf (mientras tanto: nginx.bootstrap.conf).
# Para emitir certs Let's Encrypt (cubre apex + www en un solo cert):
#   docker compose stop nginx
#   docker run --rm -p 80:80 \
#     -v /etc/letsencrypt:/etc/letsencrypt \
#     certbot/certbot certonly --standalone \
#     -d ligaplus.cl -d www.ligaplus.cl \
#     --agree-tos -m rmorales.olate@gmail.com --non-interactive
#
# Dominio canónico: www.ligaplus.cl. El apex (ligaplus.cl) redirige a www,
# así todo el tráfico tiene un único origen y el CORS del API solo necesita
# https://www.ligaplus.cl (= APP_URL).

# Rate limit zones — declarar en http context (este archivo está incluido
# desde /etc/nginx/conf.d, ya está dentro de http {}).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

# No exponer la versión de nginx en headers/errores (fingerprinting).
server_tokens off;

# HTTP → HTTPS (canónico www) + ACME challenge para renovación de certs
server {
    listen 80;
    server_name ligaplus.cl www.ligaplus.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.ligaplus.cl$request_uri;
    }
}

# HTTPS apex → redirige a www (canonicalización)
server {
    listen 443 ssl http2;
    server_name ligaplus.cl;

    ssl_certificate /etc/letsencrypt/live/ligaplus.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligaplus.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    return 301 https://www.ligaplus.cl$request_uri;
}

# HTTPS principal — www.ligaplus.cl
server {
    listen 443 ssl http2;
    server_name www.ligaplus.cl;

    ssl_certificate /etc/letsencrypt/live/ligaplus.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligaplus.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Headers de seguridad (redundantes con los del API/Next pero defensa
    # en profundidad — nunca confiar en una sola capa).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # API
    # IMPORTANTE: proxy_pass SIN trailing slash. Si pusieras "http://api:3000/"
    # (con slash final), nginx stripearía el "/api/" del path antes de proxear
    # — el backend NestJS tiene globalPrefix='api/v1', así que un GET
    # /api/v1/auth/me llegaría como /v1/auth/me y devolvería 404 "Cannot POST".
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Sprint 18 — Match Center WebSocket. Socket.io expone /socket.io/
    # en el namespace /match-center → URL final /socket.io/?... y la
    # negociación HTTP→WS requiere los headers Upgrade/Connection.
    # Sin esto, el cliente se queda en polling permanente (funciona pero
    # consume más).
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Rate limit estricto en login
    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=2 nodelay;
        proxy_pass http://api:3000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
