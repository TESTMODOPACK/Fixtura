# Nginx bootstrap — HTTP only, sin TLS.
#
# Para usar mientras NO tengas dominio (responde con la IP cruda del VPS).
# Cuando obtengas el dominio, cambiar la env var NGINX_CONF=nginx.conf
# (la versión con TLS + Let's Encrypt) y correr certbot.
#
# Acepta cualquier Host (server_name _) porque inicialmente accedés por IP.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Reservado para Let's Encrypt cuando agregues dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate limit estricto en login (cuenta IPs reales gracias a trust_proxy del API)
    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=2 nodelay;
        proxy_pass http://api:3000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
