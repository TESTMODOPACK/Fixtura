# Nginx bootstrap — HTTP only, sin TLS.
#
# Para usar mientras NO tengas dominio (responde con la IP cruda del VPS).
# Cuando obtengas el dominio, cambiar la env var NGINX_CONF=nginx.conf
# (la versión con TLS + Let's Encrypt) y correr certbot.
#
# Acepta cualquier Host (server_name _) porque inicialmente accedés por IP.

# T6 (A-10): todo el tráfico externo llega vía el nginx de Eva360, así que
# $remote_addr era SIEMPRE la IP del proxy — todos los usuarios compartían
# un único bucket de rate limit (5 logins/min para toda la plataforma).
# Confiamos X-Forwarded-For solo cuando el peer directo es de rango privado
# (los proxies propios del VPS); recursive salta la cadena completa.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

# No exponer la versión de nginx en headers/errores (fingerprinting).
server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Reservado para Let's Encrypt cuando agregues dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    # IMPORTANTE: proxy_pass SIN trailing slash. Con slash final, nginx
    # stripea el /api/ del path antes de proxear, y NestJS (globalPrefix
    # 'api/v1') devuelve 404 "Cannot POST /v1/...".
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Sprint 18 — Match Center WebSocket. Headers Upgrade/Connection
    # son necesarios para pasar de HTTP a WS sin caer a polling.
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Rate limit estricto en login — por IP real del cliente (realip arriba;
    # el trust_proxy del API solo afecta al throttler de Nest, no a nginx).
    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=2 nodelay;
        proxy_pass http://api:3000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
