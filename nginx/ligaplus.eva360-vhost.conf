# ─────────────────────────────────────────────────────────────────────
# Bloques nginx para AGREGAR al nginx.conf de Eva360 (el reverse proxy que
# ya está en los puertos 80/443 del VPS). Hacen que www.ligaplus.cl resuelva
# a LigaPlus, que corre en el mismo VPS publicando su nginx en el puerto 8080.
#
# Eva360 termina el TLS de ligaplus.cl y reenvía TODO el tráfico al :8080;
# LigaPlus (nginx.bootstrap.conf) hace su propio routing /api → api, / → web.
#
# Requisito: el servicio `nginx` de Eva360 debe poder resolver
# host.docker.internal. Agregar en el docker-compose.yml de Eva360:
#     nginx:
#       extra_hosts:
#         - "host.docker.internal:host-gateway"
#   y recrear: docker compose up -d nginx
#
# Ver el runbook completo en docs/COEXISTENCIA_EVA360.md
# ─────────────────────────────────────────────────────────────────────

# HTTP: ACME challenge (renovación de cert) + redirect a HTTPS canónico (www)
server {
    listen 80;
    server_name ligaplus.cl www.ligaplus.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.ligaplus.cl$request_uri;
    }
}

# HTTPS apex (ligaplus.cl) → redirige a www
server {
    listen 443 ssl http2;
    server_name ligaplus.cl;

    ssl_certificate /etc/letsencrypt/live/ligaplus.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligaplus.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://www.ligaplus.cl$request_uri;
}

# HTTPS www → proxy a LigaPlus (nginx en el puerto 8080 del host)
server {
    listen 443 ssl http2;
    server_name www.ligaplus.cl;

    ssl_certificate /etc/letsencrypt/live/ligaplus.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligaplus.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10M;

    # Pass-through total: LigaPlus (en :8080) hace su propio routing interno
    # (/api → api, /socket.io → api, / → web). Los headers Upgrade habilitan
    # el WebSocket del Match Center. Host se preserva para que LigaPlus
    # resuelva www.ligaplus.cl como host de marketing.
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
