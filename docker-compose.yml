# ══════════════════════════════════════════════════════════════════════
# Fixtura — Docker Compose para PRODUCCIÓN (Hostinger / Hetzner VPS)
# ══════════════════════════════════════════════════════════════════════
#
# Este es el archivo que paneles tipo "Administrador de Docker" de
# Hostinger o Portainer toman por convención. Para dev local con Docker
# está `docker-compose.dev.yml` (solo db + redis).
#
# Uso:
#   1. Copiar .env.example → .env y completar valores reales.
#      JWT_SECRET y SSO_STATE_SECRET ≥32 chars, distintos entre sí.
#   2. export GIT_SHA=$(git rev-parse --short HEAD)
#   3. docker compose up -d
#   4. Primer arranque (migraciones + seed):
#        docker compose exec api sh -c "pnpm migration:run && pnpm db:seed"
#
# Memoria y CPU calibradas para Hostinger KVM 2 (2 vCPU / 8 GB RAM).
# Total reservado ~5.5 GB, deja ~2.5 GB para el sistema + buffers/cache.
#
# Log rotation: cada servicio rota a 50m × 5 archivos. Sin esto los logs
# llenan el disco en semanas.
# ══════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    container_name: fixtura_db
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-fixtura}
      POSTGRES_USER: ${DB_USER:-fixtura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debe definir DB_PASSWORD}
      # Sin esto Postgres corre en UTC, lo que hace que CURRENT_DATE
      # quede desfasada de 3-4 horas vs el operador chileno. El cron
      # de dunning chequea vencimientos contra CURRENT_DATE, asi que
      # un cobro vence "ayer" si se ejecuta despues de las 21:00 CLT.
      TZ: ${TZ:-America/Santiago}
      PGTZ: ${TZ:-America/Santiago}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exponemos 5432 al host en producción. El API se conecta vía la
    # red interna de Docker (host: db, puerto 5432). Para administración
    # ad-hoc: docker compose exec db psql -U fixtura, o SSH tunnel
    # directo al container. Evita conflictos con un Postgres nativo del
    # VPS si está pre-instalado.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixtura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: fixtura_redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: fixtura_api
    restart: unless-stopped
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: 1.5
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgres://${DB_APP_USER:-${DB_USER:-fixtura}}:${DB_APP_PASSWORD:-${DB_PASSWORD}}@db:5432/${DB_NAME:-fixtura}?sslmode=disable
      DB_USER: ${DB_USER:-fixtura}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-fixtura_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-fixtura}
      DB_HOST: db
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Debe definir JWT_SECRET en .env}
      SSO_STATE_SECRET: ${SSO_STATE_SECRET:?Debe definir SSO_STATE_SECRET (distinto de JWT_SECRET)}
      FRONTEND_URL: ${APP_URL:?Debe definir APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Fixtura <onboarding@resend.dev>}
      # Clave para cifrar credenciales de pasarela de pago por liga (AES-256-GCM).
      # Generar con: openssl rand -base64 32. Sin esto, no se pueden guardar
      # las llaves de Flow/Khipu (pero transferencia manual funciona igual).
      PAGOS_ENC_KEY: ${PAGOS_ENC_KEY:-}
      # Base pública del API — la usa el PagosService para armar la URL del
      # webhook de Flow (urlConfirmation). En prod = https://www.ligaplus.cl/api.
      API_URL: ${API_URL:-}
      # Entorno de Flow para TODAS las ligas: sandbox (default) | production.
      # Las credenciales que cargue cada liga deben ser del mismo entorno.
      FLOW_MODE: ${FLOW_MODE:-sandbox}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${GIT_SHA:-unknown}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      # En dev local con Postgres nativo (DB_APP_USER == DB_USER) seteamos
      # esto en true para que cleanup-orphans no intente crear un rol app
      # separado. En prod con role separation, false.
      SKIP_CLEANUP_ORPHANS: ${SKIP_CLEANUP_ORPHANS:-}
      # Fallback de tenant para hosts sin custom_domain configurado.
      # En el VPS sin dominio, setear a 'liga-demo' permite ver el portal
      # accediendo por IP. Cuando el cliente configura su custom_domain,
      # esta variable se puede dejar vacía.
      FALLBACK_TENANT_SLUG: ${FALLBACK_TENANT_SLUG:-}
      # TTLs JWT — el código los lee directamente de process.env
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Sprint 34G+ — TZ explicita. main.ts tambien lo setea como fallback
      # pero pasarlo aca lo deja visible en docker inspect y permite que
      # el cron y los logs usen la zona de la liga.
      TZ: ${TZ:-America/Santiago}
    # No exponemos 3000 al host — nginx hace el proxy desde 80/443.
    # ports:
    #   - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # RELATIVA a propósito (/api). El front llama a la API del MISMO host
        # por el que entró el navegador → sin CORS y con el tenant correcto
        # resuelto por Host. Una URL absoluta (https://www.ligaplus.cl/api)
        # rompe el acceso por IP y por subdominios de liga (multi-tenant).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: fixtura_web
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    # No exponemos 3001 al host — nginx hace el proxy desde 80/443.
    # ports:
    #   - "127.0.0.1:3001:3001"
    healthcheck:
      # `/login` se eliminó en el cleanup del onboarding multi-tenant — el
      # healthcheck quedó apuntando a una ruta inexistente y el container
      # quedaba marcado unhealthy aunque Next.js estaba sirviendo OK.
      # Usamos `/` (portal público home) que siempre responde 200.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    # Build self-contained — el conf se embebe en la imagen, sin bind mount.
    # Esto evita el problema de paneles (Hostinger Docker Manager, Portainer)
    # que arrancan los containers desde un working_dir distinto al clone
    # del repo, donde los archivos del repo no existen.
    #
    # Para cambiar entre bootstrap.conf (HTTP) y nginx.conf (TLS), cambiar
    # la env var NGINX_CONF y rebuildear:
    #   docker compose build nginx && docker compose up -d nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_CONF: ${NGINX_CONF:-nginx.bootstrap.conf}
    container_name: fixtura_nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s
    depends_on:
      - api
      - web
    # Puertos 8080/8443 para coexistir con otro proyecto que ya usa 80/443
    # en este VPS. Para producción definitiva (cuando Fixtura tenga su
    # propio VPS o un reverse proxy host-level con SNI routing), volver a
    # 80:80 y 443:443.
    ports:
      - "8080:80"
      - "8443:443"
    # Sin volumes — el conf está adentro de la imagen.
    # Cuando agregues dominio y certs Let's Encrypt: descomentar este mount
    # (asegurate de que /etc/letsencrypt/live/<dominio>/ exista en el host).
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    #   - ./nginx/certbot/www:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
