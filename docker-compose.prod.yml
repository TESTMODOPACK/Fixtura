# ══════════════════════════════════════════════════════════════════════
# Fixtura — Docker Compose para PRODUCCIÓN (Hostinger / Hetzner VPS)
# ══════════════════════════════════════════════════════════════════════
#
# Uso:
#   1. Copiar .env.example → .env y completar valores reales.
#      JWT_SECRET y SSO_STATE_SECRET ≥32 chars, distintos entre sí.
#   2. export GIT_SHA=$(git rev-parse --short HEAD)
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. Primer arranque: docker compose -f docker-compose.prod.yml exec api \
#        pnpm migration:run && pnpm db:seed
#
# Memoria y CPU calibradas para Hostinger KVM 2 (2 vCPU / 8 GB RAM).
# Total reservado ~5.5 GB, deja ~2.5 GB para el sistema + buffers/cache.
#
# Log rotation: cada servicio rota a 50m × 5 archivos. Sin esto los logs
# llenan el disco en semanas.
# ══════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    container_name: fixtura_db
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-fixtura}
      POSTGRES_USER: ${DB_USER:-fixtura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debe definir DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixtura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: fixtura_redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: fixtura_api
    restart: unless-stopped
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: 1.5
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgres://${DB_APP_USER:-${DB_USER:-fixtura}}:${DB_APP_PASSWORD:-${DB_PASSWORD}}@db:5432/${DB_NAME:-fixtura}?sslmode=disable
      DB_USER: ${DB_USER:-fixtura}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-fixtura_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-fixtura}
      DB_HOST: db
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Debe definir JWT_SECRET en .env}
      SSO_STATE_SECRET: ${SSO_STATE_SECRET:?Debe definir SSO_STATE_SECRET (distinto de JWT_SECRET)}
      FRONTEND_URL: ${APP_URL:?Debe definir APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Fixtura <onboarding@resend.dev>}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${GIT_SHA:-unknown}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://fixtura.cl/api}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: fixtura_web
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://fixtura.cl/api}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: fixtura_nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # En bootstrap (sin dominio): NGINX_CONF=nginx.bootstrap.conf (HTTP only).
      # Cuando tengas dominio: NGINX_CONF=nginx.conf (con TLS + Let's Encrypt).
      - ./nginx/${NGINX_CONF:-nginx.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
