name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.10.0'
  PNPM_VERSION: '9.0.0'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixtura
          POSTGRES_PASSWORD: fixtura
          POSTGRES_DB: fixtura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixtura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # T10 — el contexto RLS se fija SOLO vía los helpers de common/rls.
      # Un set_config suelto compila y "funciona", pero deja la conexión
      # con residuo o sin contexto — el bug C-2 nació exactamente así.
      # Permitido: common/rls/ (helpers + spec) y database/ (scripts
      # standalone que abren su propia conexión).
      - name: RLS — set_config solo en common/rls y database/
        run: |
          PATRON="set_config[[:space:]]*\([[:space:]]*['\"]app\.|SET[[:space:]]+(LOCAL[[:space:]]+)?app\."
          VIOLACIONES=$(grep -rnE "$PATRON" apps/api/src packages --include='*.ts' \
            | grep -v 'apps/api/src/common/rls/' \
            | grep -v 'apps/api/src/database/' \
            || true)
          if [ -n "$VIOLACIONES" ]; then
            echo "::error::set_config de app.* fuera de common/rls o database/. Usar fijarTenantLocal/fijarBypassLocal/runConTenant/runComoSistema (common/rls/rls-context.ts):"
            echo "$VIOLACIONES"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://fixtura:fixtura@localhost:5432/fixtura_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-secret-with-at-least-32-characters-for-tests
          SSO_STATE_SECRET: another-ci-only-secret-32-chars-for-state-cookies
          NODE_ENV: test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      # Gate T29 (adelantado por el hallazgo F1-A): el schema debe poder
      # levantarse DESDE CERO — migraciones + cleanup-orphans DOS veces
      # (idempotencia) contra una base vacía. Habría detectado el 42P01 de
      # la convergencia RLS corriendo antes de crear sus tablas.
      - name: Schema desde cero (migraciones + cleanup-orphans ×2)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://fixtura:fixtura@localhost:5432/fixtura_schema_gate
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: fixtura_schema_gate
          DB_USER: fixtura
          DB_PASSWORD: fixtura
          NODE_ENV: test
        run: |
          PGPASSWORD=fixtura psql -h localhost -U fixtura -d fixtura_test \
            -c 'CREATE DATABASE fixtura_schema_gate'
          pnpm migration:run
          node dist/database/cleanup-orphans.js
          node dist/database/cleanup-orphans.js

  # Visibilidad de CVEs en dependencias. `continue-on-error` mientras Next 14
  # arrastre advisories sin parche en la 14.x (T53 lo sube a 15 y este job
  # pasa a bloquear).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+)
        run: pnpm audit --prod --audit-level=high
