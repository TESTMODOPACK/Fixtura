name: Deploy to VPS

# Deploy MANUAL (workflow_dispatch) — un push a main ya NO despliega.
#
# Por qué (hallazgo A-8, auditoría 2026-10-05):
#   - La versión anterior corría en cada push, sin depender del CI, sin
#     backup, y ejecutaba `pnpm migration:run` con una migración
#     destructiva (DropModeloViejo) en la carpeta.
#   - Este workflow delega TODO en scripts/deploy.sh — el mismo camino
#     que el deploy manual: backup previo, build secuencial --no-cache,
#     espera de healthy y smoke tests. Un solo camino de deploy.
#   - Las migraciones formales NO corren acá: son operación manual
#     documentada (docs/OPS_RUNBOOK.md y migrations-cuarentena/README.md).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger (scripts/deploy.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nota: environment.url NO admite el contexto `secrets` (el workflow
    # queda inválido y ni aparece ejecutable) — por eso va sin url.
    environment:
      name: production

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -euo pipefail
            cd ~/fixtura
            git fetch origin main
            git reset --hard origin/main
            ./scripts/deploy.sh rolling
          ENDSSH

      - name: Post-deploy verification
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          # Validación externa: el web responde a través de toda la cadena
          # (Eva360 nginx → fixtura_nginx → next). /health/* no se expone
          # públicamente, así que el check externo es la raíz del sitio.
          if [ -n "$PROD_URL" ]; then
            echo "==> Verificando $PROD_URL desde GitHub runner"
            for i in 1 2 3; do
              if curl -fsS "$PROD_URL/" > /dev/null; then
                echo "OK"
                exit 0
              fi
              sleep 5
            done
            echo "Smoke externo falló"
            exit 1
          else
            echo "PRODUCTION_URL no configurado — skip verificación externa"
          fi
